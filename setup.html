<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a Bday Surprise</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="setup-page">
    <div class="balloon balloon-one" aria-hidden="true"></div>
    <div class="balloon balloon-two" aria-hidden="true"></div>
    <div class="balloon balloon-three" aria-hidden="true"></div>
    <div class="balloon balloon-four" aria-hidden="true"></div>
    <main class="container setup-card">
        <p class="eyebrow">Sender setup</p>
        <h1 class="header_text">Create your Bday Surprise</h1>
        <form id="setupForm" class="setup-form">
            <label for="themeColor">Choose a theme color</label>
            <input id="themeColor" name="themeColor" type="color" value="#111111">
            <label for="celebrant">Name of the birthday celebrant</label>
            <input id="celebrant" name="celebrant" placeholder="For example, Alex" required>
            <label for="message">Final card message</label>
            <textarea id="message" name="message" rows="7" maxlength="500" required>Wishing you a day full of love, laughter, and lots of cake.</textarea>
            <button class="btn" type="submit">Create link</button>
        </form>
        <p id="linkError" class="link-error" role="alert" hidden></p>
        <div id="linkResult" class="link-result" hidden>
            <p>Your personal birthday link is ready:</p>
            <input id="shareLink" readonly>
            <button class="btn" id="copyLink" type="button">Copy link</button>
        </div>
    </main>
    <script src="script.js"></script>
    <script>
        const setupForm = document.getElementById("setupForm");
        const linkResult = document.getElementById("linkResult");
        const shareLink = document.getElementById("shareLink");
        const linkError = document.getElementById("linkError");
        const createButton = setupForm.querySelector("button[type='submit']");

        setupForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            createButton.disabled = true;
            linkError.hidden = true;
            try {
                const response = await fetch("https://happy-bday-gift.netlify.app/.netlify/functions/cards", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        color: document.getElementById("themeColor").value,
                        name: document.getElementById("celebrant").value,
                        message: document.getElementById("message").value
                    })
                });
                if (!response.ok) throw new Error("Could not save this card. Please try again.");
                const { id } = await response.json();
                shareLink.value = `https://happy-bday-gift.netlify.app/c/${id}`;
                linkResult.hidden = false;
            } catch (error) {
                linkError.textContent = error.message || "Could not create the link. Please try again.";
                linkError.hidden = false;
            } finally {
                createButton.disabled = false;
            }
        });

        document.getElementById("copyLink").addEventListener("click", async () => {
            await navigator.clipboard.writeText(shareLink.value);
            document.getElementById("copyLink").textContent = "Copied!";
        });
    </script>
</body>
</html>
