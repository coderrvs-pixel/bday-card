<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Set Up the Birthday Card</title>
	<link rel="stylesheet" href="style.css">
</head>

<body class="setup_page">
	<main class="setup_panel">
		<p class="eyebrow">A little birthday surprise</p>
		<h1 class="header_text">Create your Bday Surprise</h1>
		<p class="text setup_copy">Choose the style, add the message, and set the number candles.</p>

		<form id="ageForm" class="age_form">
			<label for="themeColor">Choose a theme color</label>
			<input id="themeColor" name="themeColor" type="color" value="#ff4a75">
			<label for="celebrantName">Celebrant's name</label>
			<input id="celebrantName" name="celebrantName" type="text" maxlength="60" autocomplete="off" required autofocus>
			<label for="senderName">Your name</label>
			<input id="senderName" name="senderName" type="text" maxlength="60" autocomplete="off" required>
			<label for="message">Final card message</label>
			<textarea id="message" name="message" rows="5" required>Wishing you a day full of love, laughter, and lots of cake.</textarea>
			<label for="age">Age of the celebrant</label>
			<input id="age" name="age" type="number" min="1" max="120" inputmode="numeric" placeholder="Example: 18" required>
			<p id="ageError" class="form_error" role="alert" aria-live="polite"></p>
			<button class="btn" type="submit">Create the card</button>
		</form>
	</main>

	<script src="script.js"></script>
</body>

</html>
