<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a Bday Surprise</title>
    <link rel="stylesheet" href="style.css?v=cake-2">
</head>
<body class="setup-page">
    <main class="container setup-card">
        <p class="eyebrow">Sender setup</p>
        <h1 class="header_text">Create your Bday Surprise</h1>
        <form id="setupForm" class="setup-form">
            <label for="themeColor">Choose a theme color</label>
            <input id="themeColor" name="themeColor" type="color" value="#ff4a75">
            <label for="celebrant">Name of the birthday celebrant</label>
            <input id="celebrant" name="celebrant" placeholder="For example, Alex" required>
            <label for="message">Final card message</label>
            <textarea id="message" name="message" rows="7" required>Wishing you a day full of love, laughter, and lots of cake.</textarea>
            <button class="btn" type="submit">Create link</button>
        </form>
        <div id="linkResult" class="link-result" hidden>
            <p>Your personal birthday link is ready:</p>
            <input id="shareLink" readonly>
            <button class="btn" id="copyLink" type="button">Copy link</button>
        </div>
    </main>
    <script src="script.js?v=cake-2"></script>
    <script>
        const setupForm = document.getElementById("setupForm");
        const linkResult = document.getElementById("linkResult");
        const shareLink = document.getElementById("shareLink");

        setupForm.addEventListener("submit", (event) => {
            event.preventDefault();
            const params = new URLSearchParams({
                color: document.getElementById("themeColor").value,
                name: document.getElementById("celebrant").value,
                message: document.getElementById("message").value
            });
            shareLink.value = `${window.location.origin}${window.location.pathname.replace("setup.html", "index.html")}?${params}`;
            linkResult.hidden = false;
        });

        document.getElementById("copyLink").addEventListener("click", async () => {
            await navigator.clipboard.writeText(shareLink.value);
            document.getElementById("copyLink").textContent = "Copied!";
        });
    </script>
</body>
</html>
