<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Surprise</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body class="escape-page">
    <div class="container">
        <div>
            <h1 class="header_text" id="questionText">Is it your birthday?</h1>
        </div>
            <p class="credit-line">
            <!-- Social tag updated to align with your personal repository profile -->
            <a class="credit" href="https://github.com">@coderrvs-pixel</a>
        </p>
        <div class="gif_container">
            <div class="cake cake-small" role="img" aria-label="Pink birthday cake"><span class="cake-decor"></span><span class="candle-flames" aria-hidden="true"><i></i><i></i><i></i></span></div>
        </div>
        <div class="buttons prank-buttons">
            <!-- The Yes button is now the target element running away on hover and click -->
            <button class="btn" id="yesButton" type="button" onclick="attemptYes()">Yes</button>
            <!-- The No button stays completely still and redirects to page 2 (yes.html) -->
            <button class="btn" id="noButton" type="button">No</button>

            <script>
                let yesAttempts = 0;
                const noButton = document.getElementById("noButton");
                noButton.style.pointerEvents = "none";

                function attemptYes() {
                    yesAttempts += 1;
                    moveButton();
                    if (yesAttempts >= 7) {
                        noButton.style.pointerEvents = "auto";
                    }
                }

                function nextPage() {
                    if (yesAttempts < 7) return;
                    window.location.href = "yes.html" + window.location.search;
                }

                function moveButton() {
                    const targetBtn = document.getElementById("yesButton");
                    targetBtn.style.position = "fixed";
                    const edgePadding = 12;
                    const maxX = Math.max(edgePadding, window.innerWidth - targetBtn.offsetWidth - edgePadding);
                    const maxY = Math.max(edgePadding, window.innerHeight - targetBtn.offsetHeight - edgePadding);
                    const x = edgePadding + Math.random() * Math.max(0, maxX - edgePadding);
                    const y = edgePadding + Math.random() * Math.max(0, maxY - edgePadding);

                    targetBtn.style.left = `${x}px`;
                    targetBtn.style.top = `${y}px`;
                }

                window.addEventListener("resize", () => {
                    const targetBtn = document.getElementById("yesButton");
                    if (targetBtn.style.position === "fixed") moveButton();
                });

                document.getElementById("noButton").addEventListener("click", () => {
                    if (yesAttempts >= 7) nextPage();
                });
            </script>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
