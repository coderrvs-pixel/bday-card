<!DOCTYPE html>
<html lang="en" class="theme-pending">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Prank</title>
    <meta property="og:type" content="website">
    <meta property="og:title" content="Happy Birthday!">
    <meta property="og:description" content="A birthday surprise is waiting for you.">
    <link rel="stylesheet" href="style.css">
</head>
<body class="receiver-page">
    <main class="container">
        <h1 class="header_text">Is it your birthday today? <span class="theme-cake" role="img" aria-label="birthday cake"><span class="theme-cake-candles" aria-hidden="true"><i></i><i></i><i></i></span><span class="theme-cake-body" aria-hidden="true"></span></span></h1>
        <p><a href="https://github.com">@coderrvs-pixel</a></p>
        <div class="gif_container">
            <div class="present receiver-present" role="img" aria-label="Wrapped birthday present">
                <span class="present-lid"></span><span class="present-ribbon vertical"></span><span class="present-ribbon horizontal"></span>
            </div>
        </div>
        <div class="buttons receiver-buttons">
            <button class="btn" id="yesButton" type="button">Yes</button>
            <button class="btn" id="noButton" type="button">No</button>
        </div>
    </main>
    <script src="script.js"></script>
    <script>
        let yesAttempts = 0;
        let screenClicks = 0;
        const noUnlockClicks = 5;
        const yesButton = document.getElementById("yesButton");
        const noButton = document.getElementById("noButton");
        const yesStartRect = yesButton.getBoundingClientRect();
        noButton.disabled = true;

        function updateNoButton() {
            noButton.disabled = screenClicks < noUnlockClicks && yesAttempts < noUnlockClicks;
        }

        document.addEventListener("pointerdown", (event) => {
            if (event.target.closest("button, a")) return;
            screenClicks += 1;
            updateNoButton();
        });

        function moveButton() {
            const padding = 16;
            const maxX = Math.max(padding, window.innerWidth - yesButton.offsetWidth - padding);
            const noRect = noButton.getBoundingClientRect();
            const maxY = Math.max(padding, window.innerHeight - yesButton.offsetHeight - padding);
            let left;
            let top;
            do {
                left = Math.round(padding + Math.random() * (maxX - padding));
                top = Math.round(padding + Math.random() * (maxY - padding));
            } while (left < noRect.right && left + yesButton.offsetWidth > noRect.left && top < noRect.bottom && top + yesButton.offsetHeight > noRect.top);
            yesButton.style.left = `${left - yesStartRect.left}px`;
            yesButton.style.top = `${top - yesStartRect.top}px`;
            yesButton.style.pointerEvents = "none";
            window.setTimeout(() => {
                yesButton.style.pointerEvents = "auto";
            }, 700);
        }

        function attemptYes() {
            yesAttempts += 1;
            moveButton();
            updateNoButton();
        }

        yesButton.addEventListener("click", attemptYes);
        noButton.addEventListener("click", () => {
            if (!noButton.disabled) window.location.href = "yes.html" + window.location.search;
        });
    </script>
</body>
</html>
