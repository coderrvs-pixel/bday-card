<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Prank</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="receiver-page">
    <main class="container">
        <h1 class="header_text">Is it your birthday today? 🎂</h1>
        <p><a href="https://github.com">@coderrvs-pixel</a></p>
        <div class="gif_container">
            <div class="present receiver-present" role="img" aria-label="Wrapped birthday present">
                <span class="present-lid"></span><span class="present-ribbon vertical"></span><span class="present-ribbon horizontal"></span>
            </div>
        </div>
        <div class="buttons receiver-buttons">
            <button class="btn" id="yesButton" type="button">Yes</button>
            <button class="btn" id="noButton" type="button">No</button>
        </div>
    </main>
    <script src="script.js"></script>
    <script>
        let yesAttempts = 0;
        let screenClicks = 0;
        let moveTimer;
        const yesButton = document.getElementById("yesButton");
        const noButton = document.getElementById("noButton");
        noButton.disabled = true;

        document.addEventListener("click", (event) => {
            if (event.target.closest("button, a")) return;
            screenClicks += 1;
            unlockNoButton();
        });

        function moveButton() {
            const padding = 16;
            const maxX = Math.max(padding, window.innerWidth - yesButton.offsetWidth - padding);
            const maxY = Math.max(padding, window.innerHeight - yesButton.offsetHeight - padding);
            const noRect = noButton.getBoundingClientRect();
            let x = padding;
            let y = padding;
            for (let attempt = 0; attempt < 20; attempt += 1) {
                x = Math.round(padding + Math.random() * (maxX - padding));
                y = Math.round(padding + Math.random() * (maxY - padding));
                if (x + yesButton.offsetWidth < noRect.left - 12 || x > noRect.right + 12 || y + yesButton.offsetHeight < noRect.top - 12 || y > noRect.bottom + 12) break;
            }
            yesButton.style.position = "fixed";
            yesButton.style.left = `${x}px`;
            yesButton.style.top = `${y}px`;
        }

        function unlockNoButton() {
            if (yesAttempts + screenClicks >= 7) noButton.disabled = false;
        }

        function attemptYes() {
            yesAttempts += 1;
            unlockNoButton();
            window.clearTimeout(moveTimer);
            moveTimer = window.setTimeout(moveButton, 500);
        }

        yesButton.addEventListener("click", attemptYes);
        noButton.addEventListener("click", () => {
            if (yesAttempts >= 7) window.location.href = "yes.html" + window.location.search;
        });
    </script>
</body>
</html>
