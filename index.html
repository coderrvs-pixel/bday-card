<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Prank</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body class="receiver-page">
    <div class="container">
        <div>
            <h1 class="header_text">Is it your birthday today? 🎂</h1>
        </div>
        <p>
            <a href="https://github.com">@coderrvs-pixel</a>
        </p>
        <div class="gif_container">
            <div class="cake receiver-cake" role="img" aria-label="Birthday cake">
                <div class="candle"><i></i></div>
                <div class="icing"></div>
                <div class="cake_body"></div>
                <div class="plate"></div>
            </div>
        </div>
        <div class="buttons">
            <button class="btn" id="yesButton" onmouseover="moveButton()" onclick="attemptYes()">Yes</button>
            <button class="btn" id="noButton" onclick="nextPage()">No</button>

            <script>
                let yesAttempts = 0;
                const noButton = document.getElementById("noButton");
                noButton.disabled = true;

                function attemptYes() {
                    yesAttempts += 1;
                    moveButton();
                    if (yesAttempts >= 7) {
                        noButton.disabled = false;
                    }
                }

                function nextPage() {
                    if (yesAttempts < 7) return;
                    window.location.href = "yes.html" + window.location.search;
                }

                function moveButton() {
                    var targetBtn = document.getElementById("yesButton");
                    var buttonArea = targetBtn.parentElement;

                    targetBtn.style.transform = "none";
                    var buttonRect = targetBtn.getBoundingClientRect();
                    var areaRect = buttonArea.getBoundingClientRect();
                    var horizontalRoom = Math.max(0, Math.min(32, buttonRect.left - areaRect.left - 4, areaRect.right - buttonRect.right - 4));
                    var verticalRoom = Math.max(0, Math.min(14, buttonRect.top - areaRect.top - 4, areaRect.bottom - buttonRect.bottom - 4));
                    var x = Math.round(Math.random() * horizontalRoom * 2 - horizontalRoom);
                    var y = Math.round(Math.random() * verticalRoom * 2 - verticalRoom);
                    targetBtn.style.transform = `translate(${x}px, ${y}px)`;
                }

                const selectedColor = new URLSearchParams(window.location.search).get("color");
                if (/^#[0-9a-f]{6}$/i.test(selectedColor || "")) {
                    document.documentElement.style.setProperty("--theme-color", selectedColor);
                }
            </script>
        </div>
    </div>
</body>

</html>
