<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Create Birthday Card</title>
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<main class="container sender_page">
		<h1 class="header_text">How old is the birthday celebrant?</h1>
		<form class="age_form" id="ageForm">
			<label for="ageInput">Age</label>
			<input id="ageInput" name="age" type="number" min="1" max="100" required autofocus>
			<button class="btn" type="submit">Create card</button>
		</form>
	</main>
	<script src="script.js"></script>
</body>

</html>
