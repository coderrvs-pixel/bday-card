<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Surprise</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container birthday-card">

        </div>
        <div class="buttons static-buttons">
            <button class="btn" id="yesButton" onclick="window.location.href = 'final.html' + window.location.search">Yes</button>
            <button class="btn" id="noButton" type="button">No</button>
        </div>
    </main>
    <script src="script.js"></script>

</html>
