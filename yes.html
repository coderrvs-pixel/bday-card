<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just Kidding!</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body class="receiver-flow">
    <div class="container">
        <div>
            <!-- Header text changed to the step-2 progressive prompt -->
            <h1 class="header_text" id="headlineText">Just kidding! You can click "Yes" now... 😉</h1>
        </div>
        <div class="gif_container">
            <div class="present receiver-present" role="img" aria-label="Wrapped birthday present">
                <span class="present-lid"></span><span class="present-ribbon vertical"></span><span class="present-ribbon horizontal"></span>
            </div>
        </div>
        <div class="buttons">
            <!-- Yes button shrinks down, No button blows up larger -->
            <button class="btn" id="yesButton" onclick="handleYes()">Yes</button>
            <button class="btn" id="noButton" onclick="handleNo()">No</button>
        </div>
    </div>

    <script>
        // Track sizing scales with state counters
        let yesScale = 1;
        let noScale = 1;
        let prankComplete = false;

        function scaleButtons() {
            const yesBtn = document.getElementById("yesButton");
            const noBtn = document.getElementById("noButton");
            const heading = document.getElementById("headlineText");

            if (prankComplete) return;

            // Inverse scaling step multipliers
            yesScale -= 0.2;
            noScale += 0.3;

            // Apply size shifts to buttons using inline styles
            yesBtn.style.transform = `scale(${Math.max(yesScale, 0.15)})`;
            noBtn.style.transform = `scale(${noScale})`;

            // Step 3 trigger: Force click gate when Yes shrinks below safety boundaries
            if (yesScale <= 0) {
                heading.innerText = 'Okay fine, you can click "Yes" now! 🥳';
                yesBtn.style.transform = "scale(0.05)";
                yesBtn.style.pointerEvents = "auto";
                noBtn.style.transform = "scale(2)";
                prankComplete = true;
            }
        }

        function handleYes() {
            if (prankComplete) {
                nextPage();
                return;
            }
            scaleButtons();
        }

        function handleNo() {
            if (!prankComplete) scaleButtons();
        }

        function nextPage() {
            // Direct pass redirection to final file layout
            window.location.href = "final.html" + window.location.search;
        }
    </script>
    <script src="script.js"></script>
</body>

</html>
