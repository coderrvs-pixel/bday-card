<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Happy Birthday!</title>
	<link rel="stylesheet" href="style.css">
</head>

<body class="receiver_page">
	<main class="birthday_panel">
		<p class="eyebrow">A birthday surprise for you</p>
		<h1 class="header_text" id="birthdayHeadline">Happy Birthday!</h1>
		<p class="text">Make a wish and blow out your candles.</p>

		<div class="cake" aria-label="Birthday cake with number candles">
			<div id="candles" class="candles"></div>
			<div class="cake_top"></div>
			<div class="cake_body"></div>
			<div class="cake_plate"></div>
		</div>

		<p id="ageMessage" class="age_message"></p>
		<p id="senderMessage" class="sender_message"></p>
		<button id="wishButton" class="btn" type="button">Blow out the candles</button>
	</main>

	<script>
		const candles = document.getElementById("candles");
		const ageMessage = document.getElementById("ageMessage");
		const wishButton = document.getElementById("wishButton");
		const cardParams = new URLSearchParams(window.location.search);
		const ageFromLink = cardParams.get("age");
		const celebrantName = cardParams.get("name") || cardParams.get("celebrantName") || localStorage.getItem("celebrantName");
		const senderName = cardParams.get("senderName") || localStorage.getItem("senderName");
		const message = cardParams.get("message") || "Wishing you a day full of love, laughter, and lots of cake.";
		const age = Number(ageFromLink || localStorage.getItem("celebrantAge"));
		const displayedAge = Number.isInteger(age) && age >= 1 && age <= 120 ? age : 0;

		if (!displayedAge) {
			window.location.href = "setup.html";
		} else {
			document.getElementById("birthdayHeadline").textContent = `Happy Birthday, ${celebrantName || "birthday star"}!`;
			String(displayedAge).split("").forEach((digit) => {
				const candle = document.createElement("span");
				candle.className = "number_candle";
				candle.textContent = digit;
				candle.setAttribute("aria-label", `${digit} candle`);
				candles.appendChild(candle);
			});
			ageMessage.textContent = `Celebrating ${displayedAge} wonderful years`;
			document.getElementById("senderMessage").textContent = senderName ? `With love from ${senderName}` : "";
			document.documentElement.style.setProperty("--accent", cardParams.get("color") || "#ff4a75");
		}

		wishButton.addEventListener("click", () => {
			document.body.classList.add("candles_out");
			wishButton.textContent = "Wish made!";
			wishButton.disabled = true;
		});
	</script>
</body>

</html>
